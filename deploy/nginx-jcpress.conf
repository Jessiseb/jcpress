# ============================================================================
# jcpress nginx 站点配置
#
# 装到 /etc/nginx/conf.d/jcpress.conf（Debian/Ubuntu）或
#        /etc/nginx/conf.d/jcpress.conf（CentOS，http 块已自动 include）
# 生效：nginx -t && systemctl reload nginx
#
# 为什么不用 vite preview：官方文档写明 preview 只用于本地预览构建产物，
# 没有缓存策略、没有预压缩、没有连接数与静态文件优化，不适合对公网。
#
# 路径对应关系（改之前先确认这三处）：
#   前端静态文件   /var/www/jcpress          ← deploy/remote-restart.sh 的 WEB_ROOT
#   后端进程       http://127.0.0.1:8091     ← 后端 server.port
#   后端 context   /api                      ← application.yml 的 server.servlet.context-path
# ============================================================================

server {
    # 80 已被别的站点占用（那台机器的 buis-front 用 server_name _ 兜了全部 80 请求），
    # 所以本站在 8800 上对外；有独立域名后可以改回 80 并给 server_name 填域名。
    listen 8800;
    listen [::]:8800;
    server_name _;                      # 有域名后改成 example.com www.example.com

    root /var/www/jcpress;
    index index.html;

    # 上传：后端 jcpress.upload.max-bytes = 5MB，nginx 留点余量
    client_max_body_size 20m;

    # ------------------------------------------------------------------
    # 压缩：js/css/json/svg 都吃得到
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ------------------------------------------------------------------
    # 带内容 hash 的产物：一年强缓存
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 字体：跨域必需，否则 CSS 里的 @font-face 会被拦
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 图片与贴图：体积大、换得少，30 天
    location ~* ^/(companies|covers|textures)/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # 后端 API
    # 后端 context-path 已经是 /api，proxy_pass 不要加尾斜杠，
    # 否则 /api/x 会被改写成 /x 打过去，全部 404。
    # 上传的图片走 /api/uploads（public-prefix 含 context-path），也被这里覆盖。
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 生成文章实测 41s，application.yml 里超时给到 120s，这里要跟着放宽
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_connect_timeout 10s;

        # 大响应不缓冲到磁盘，AI 流式输出时更顺
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # SPA 路由：React Router 的 /tech/xxx 这类前端路由直接刷新时，
    # 磁盘上没有对应文件，必须回落到 index.html
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 本身不能缓存，否则发版后用户拿到的还是旧壳、指向已删除的旧 asset
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    access_log /var/log/nginx/jcpress.access.log;
    error_log  /var/log/nginx/jcpress.error.log warn;
}
