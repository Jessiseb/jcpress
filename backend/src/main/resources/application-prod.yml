# 生产环境配置
# 激活方式：--spring.profiles.active=prod
#
# 安全：仓库是 public，这里不写服务器公网 IP、不写任何口令。
#   MySQL 地址走 DB_HOST（默认本机回环，MySQL 与后端同机时不用额外配）
#   口令走环境变量：DB_PASSWORD / REDIS_PASSWORD / JCPRESS_AI_API_KEY
#   服务器注入方式：backend/.env（模板见 backend/.env.example，.env 不入库）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/jcpress?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD}
  data:
    redis:
      # 后端与 Redis 同机，用本机回环地址，不暴露到公网
      host: 127.0.0.1
      port: 6338
      database: 0
      timeout: 5000
      # Redis 已启用 requirepass，必须传密码（从 .env 的 REDIS_PASSWORD 注入，不写死）
      password: ${REDIS_PASSWORD}
  flyway:
    # 生产库严禁 clean（防止误删数据）
    clean-disabled: true

logging:
  level:
    com.jcpress: info
